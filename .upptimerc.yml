owner: human-does
repo: testcoche-status

sites:
  - name: App
    url: https://app.testcoche.com
    # The sign-in page. 200 here means Next.js is serving and the certificate is valid.

  - name: Backups
    url: https://backups.testcoche.com/health
    # Not a website check. This endpoint returns 503 the moment the newest nightly dump is
    # more than a day old, or the last backup run exited non-zero — so a backup that quietly
    # stops becomes an ordinary uptime alert. That is why there is no healthchecks.io in this
    # project: the dead-man's-switch is this endpoint plus this check.
    #
    # It sits outside the basic auth that covers the rest of that host, and answers only
    # BACKUPS_OK or BACKUPS_STALE — nothing worth authenticating.

  - name: Deploy panel
    url: https://dokploy.testcoche.com
    # Dokploy answers on its login page. If this is down, deploys are down.

workflowSchedule:
  uptime: "*/5 * * * *"

status-website:
  cname: status.testcoche.com
  # A custom domain serves from the root, so baseUrl must be empty — setting it to "/" makes
  # Upptime emit doubled slashes and redirect the site to /error. Learned on Mangobeds.
  baseUrl: ""
  theme: light
  name: Test Coche
  introTitle: Estado de la plataforma
  introMessage: Estado en **tiempo real** de la plataforma de Test Coche.

assignees:
  - reymon359

i18n:
  footer: "[Test Coche](https://testcoche.com)"
